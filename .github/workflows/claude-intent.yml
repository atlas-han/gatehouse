# 이슈 코멘트에 @claude 를 남기면 INTENT 초안을 코멘트로 단다(하네스 설계 Layer 6).
# 필요: 저장소 secret ANTHROPIC_API_KEY. 코드는 바꾸지 않고 코멘트만 쓴다.
# --bare 를 쓰지 않는다. CLAUDE.md, rules, hooks가 CI에서도 적용되게 하려는 것이다.
name: claude-intent

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  intent:
    if: ${{ !github.event.issue.pull_request && contains(github.event.comment.body, '@claude') && github.event.comment.author_association == 'OWNER' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            이슈 #${{ github.event.issue.number }}에 대해 .claude/skills/intent/SKILL.md 형식의 INTENT 초안을 만든다.
            파일을 만들거나 커밋하지 않는다. 초안을 이 이슈에 코멘트 하나로 남긴다.
            PRD(docs/prd/)와 계획(docs/plan/development-plan.md)에서 관련 요구 ID와 결정을 찾아 적고,
            이슈와 PRD에 없는 요구는 열린 질문으로 남긴다.
          claude_args: --allowedTools "Read,Glob,Grep,Bash(gh issue view:*),Bash(gh issue comment:*)"
